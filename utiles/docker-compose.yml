networks:  # Definir la red primero
  jdc-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16  # Red fija para mejor estabilidad
    driver_opts:
      com.docker.network.bridge.name: jdc-bridge

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_HEAP_OPTS: "-Xmx256M -Xms256M"
    ports:
      - "2181:2181"
    networks:
      - jdc-network
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 256M
    mem_reservation: 192M
    restart: unless-stopped  # Anadir restart policy
    logging:  #Anadir logging igual que los demas
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"        

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    networks:
      - jdc-network
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
       # ADVERTISED_LISTENERS: Para conexiones externas
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      # LISTENERS: Para conexiones dentro de Docker
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"  # Importante para crear tópicos automáticamente
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_HEAP_OPTS: "-Xmx256M -Xms256M"
      KAFKA_CREATE_TOPICS: "_schemas:1:1,tareas-prioritarias:3:1"
      #Optimizaciones adicionales
      KAFKA_LOG_CLEANER_ENABLE: "true"
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    mem_limit: 512M
    mem_reservation: 512M
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"    

  schema-registry:
    image: confluentinc/cp-schema-registry:7.5.0
    container_name: schema-registry
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - jdc-network
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      #IMPORTANTE: Usar el listener INTERNAL para comunicación entre contenedores
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_CACHE_SIZE: 500
      SCHEMA_REGISTRY_KAFKASTORE_TIMEOUT_MS: 10000
      SCHEMA_REGISTRY_KAFKASTORE_INIT_TIMEOUT_MS: 15000
      SCHEMA_REGISTRY_MASTER_ELIGIBILITY: "true"
      SCHEMA_REGISTRY_DEBUG: "false"
      SCHEMA_REGISTRY_KAFKASTORE_COMPRESSION_TYPE: "snappy"
      SCHEMA_REGISTRY_ACCESS_CONTROL_ALLOW_METHODS: "GET,POST,PUT,OPTIONS"
      SCHEMA_REGISTRY_ACCESS_CONTROL_ALLOW_ORIGIN: "*"
      SCHEMA_REGISTRY_HEAP_OPTS: "-Xmx256M -Xms256M"
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/subjects || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    mem_limit: 512M
    mem_reservation: 384M
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  kafbat-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: kafbat-ui
    ports:
      - "8086:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED: 'true'
      KAFKA_CLUSTERS_0_NAME: vm-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
      KAFKA_CLUSTERS_0_METRICS_POLLING_INTERVAL_SEC: 30
      JAVA_OPTS: "-Xmx512M -Xms512M"
      SERVER_TOMCAT_CONNECTION_TIMEOUT: 60000
      SERVER_TOMCAT_MAX_CONNECTIONS: 50
      KAFKA_CLUSTERS_0_READONLY: "false"  # Permitir operaciones si es necesario
      KAFKA_CLUSTERS_0_PROPERTIES_SECURITY_PROTOCOL: "PLAINTEXT"  # Explícito 30
    networks:
      - jdc-network
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8080 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s   
    mem_limit: 768M
    mem_reservation: 512M
    restart: on-failure:3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JAR_FILE: target/*.jar  # Si quieres pasar el nombre del JAR
    image: app:latest
    container_name: app
    depends_on:
      schema-registry:
        condition: service_healthy
    environment:
      QUARKUS_HTTP_PORT: 8084
      KAFKA_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:29092
      MP_MESSAGING_OUTGOING_TAREAS-PRIORITARIAS-OUT_BOOTSTRAP_SERVERS: kafka:29092
      MP_MESSAGING_CONNECTOR_SMALLRYE_KAFKA_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      QUARKUS_LOG_LEVEL: DEBUG
      QUARKUS_KAFKA_SNAPSHOT_PRODUCER_ENABLE: "false"
      JAVA_OPTS: "-Xmx512M -Xms256M -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+UseStringDeduplication"     
    ports:
      - "8080:8084"
    networks:
      jdc-network:
        aliases:
          - app
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f java || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s      
    mem_limit: 512M  # Aumentar de 512M
    mem_reservation: 512M
    restart: on-failure:3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"        